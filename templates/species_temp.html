{% extends 'base.html' %}

{% block head %}
    <!--
        Head Block:
        - Loads Highcharts, D3, DataTables, Bootstrap libraries.
        - Defines custom CSS for tables, charts, tree, and tooltips.
    -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/histogram-bellcurve.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <style>
        .dtableforstrain {
            margin-left: 18%;
            margin-right: 20%;
            height: 50px;
            margin-top: 20px;
            width: 75%;
        }
        .dtprojectforstrain {
            margin-left: 18%;
            margin-right: 20%;
            height: 50px;
            width: 75%;
            margin-top: 35%;
        }
        #project_id.dataTable tbody tr:hover {
            background-color: white;
        }
        #table_id.dataTable tbody tr:hover {
            background-color: lightgrey;
        }
        .highcharts-figure,
        .highcharts-data-table table {
            min-width: 310px;
            max-width: 800px;
            margin: 1em auto;
        }
        .highcharts-data-table table {
            font-family: Verdana, sans-serif;
            border-collapse: collapse;
            border: 1px solid #ebebeb;
            margin: 10px auto;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .highcharts-data-table caption {
            padding: 1em 0;
            font-size: 1.2em;
            color: #555;
        }
        .highcharts-data-table th {
            font-weight: 600;
            padding: 0.5em;
        }
        .highcharts-data-table td,
        .highcharts-data-table th,
        .highcharts-data-table caption {
            padding: 0.5em;
        }
        .highcharts-data-table thead tr,
        .highcharts-data-table tr:nth-child(even) {
            background: #f8f8f8;
        }
        .highcharts-data-table tr:hover {
            background: #f1f7ff;
        }
        .highcharts-credits {
            display: none !important;
        }
        .highcharts-contextbutton,
        .highcharts-exporting-group,
        .highcharts-button-symbol.highcharts-print-button {
            display: none;
        }
        .node circle {
            fill: #fff;
            stroke: steelblue;
            stroke-width: 2px;
        }
        .node text {
            font: 9.5px sans-serif;
            text-anchor: middle;
            font-weight: bold;
        }
        .link {
            fill: none;
            stroke: #ccc;
            stroke-width: 1.5px;
        }
        .tooltip {
            position: absolute;
            text-align: center;
            width: 150px;
            height: 28px;
            padding: 2px;
            font: 12px sans-serif;
            background: lightsteelblue;
            border: 0px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
{% endblock %}

{% block body %}
    <!--
        Body Block:
        - D3 radial tree for genome clusters.
        - Table of strains and metadata.
        - Table of projects and descriptions.
    -->
    <div id="tree-container" style="margin-left: 38%"></div>

    <div class="dtableforstrain">
        <table id="table_id" class="table table-hover">
            <thead style="background-color: rgb(189, 189, 189);">
                <tr>
                    <th>PlateIDs</th>
                    <th>ID</th>
                    <th>Plate</th>
                    <th>Media</th>
                    <th>Strain</th>
                    <th>Metadata/Modifications</th>
                    <th>Phylogroup/Genome Cluster</th>
                    <th>MLST</th>
                    <th>Project</th>
                </tr>
            </thead>
        </table>
    </div>

    <div class="dtprojectforstrain">
        <table id="project_id" class="table table-hover">
            <thead style="background-color: rgb(189, 189, 189);">
                <tr>
                    <th>Projects</th>
                    <th>Descriptions</th>
                </tr>
            </thead>
        </table>
    </div>
{% endblock %}

{% block script %}
    <!--
        Script Block:
        - Configures DataTables for strains and projects.
        - Handles row click to navigate to strain data page.
        - Renders D3 radial tree for genome clusters.
        - (Optional) Highcharts histogram for phenotype distribution (commented).
    -->
    <script>
        var data = {{ gmax_resp|safe }};
        var data2 = {{ ngmax_resp|safe }};
        var data3 = {{ ug_max_resp|safe }};
    </script>
    <script>
        $(document).ready(function() {
            var table = $('#table_id').DataTable({
                "ajax": '/strains/json?strain={{ specie }}',
                "lengthChange": true,
                "deferRender": true,
                "info": true,
                "lengthMenu": [[8, 20, 50, -1], [8, 20, 50, "All"]],
                "columnDefs": [{
                    "targets": 0,
                    "visible": false,
                    "searchable": false
                }]
            });

            // Row click event: navigate to strain data page
            $('#table_id tbody').on('click', 'tr', function() {
                var plateID = table.row(this).data()[0];
                var plate = table.row(this).data()[2];
                var media = table.row(this).data()[3];
                var strid = table.row(this).data()[1];
                var metadata = table.row(this).data()[5];
                var strain = table.row(this).data()[4];
                var url = "{{ url_for('mainstraindata') }}" +
                    "?pltid=" + plateID +
                    "&strn={{ specie }}" +
                    "&plate=" + plate +
                    "&media=" + media +
                    "&strid=" + strid +
                    "&metadata=" + metadata +
                    "&strain=" + strain;
                window.location.href = url;
            });
        });

        $(document).ready(function() {
            $('#project_id').DataTable({
                "ajax": '/projects/json?strain={{ specie }}',
                "info": false,
                "lengthChange": false,
                "deferRender": false,
                "scrollY": true,
                "bPaginate": false,
                "bFilter": false,
                "bInfo": false
            });
        });

        // D3 radial tree rendering for genome clusters
        fetch('/tree_json')
            .then(response => response.json())
            .then(data => drawTree(data));

        /**
         * Draws a radial D3 tree for genome clusters.
         * @param {Object} treeData - JSON tree data.
         */
        function drawTree(treeData) {
            const width = 600;
            const height = 600;
            const radius = width / 1.75;

            const tree = d3.cluster().size([2 * Math.PI, radius - 100]);
            const root = d3.hierarchy(treeData);
            tree(root);

            const svg = d3.select("#tree-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${width / 2},${height / 2})`);

            svg.selectAll(".link")
                .data(root.links())
                .enter().append("line")
                .attr("class", "link")
                .attr("x1", d => radialPoint(d.source.x, d.source.y)[0])
                .attr("y1", d => radialPoint(d.source.x, d.source.y)[1])
                .attr("x2", d => radialPoint(d.target.x, d.target.y)[0])
                .attr("y2", d => radialPoint(d.target.x, d.target.y)[1]);

            const node = svg.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `
                    rotate(${d.x * 180 / Math.PI - 90})
                    translate(${d.y},0)
                `);

            node.append("circle")
                .attr("r", 4)
                .on("mouseover", function(event, d) {
                    if (d.data.name) {
                        d3.select(this).attr("stroke", "orange");
                        tooltip.transition()
                            .duration(200)
                            .style("opacity", .9);
                        tooltip.html(d.data.name)
                            .style("left", (event.pageX + 5) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    }
                })
                .on("mouseout", function(event, d) {
                    if (d.data.name) {
                        d3.select(this).attr("stroke", "steelblue");
                        tooltip.transition()
                            .duration(500)
                            .style("opacity", 0);
                    }
                });

            node.append("text")
                .attr("dy", "0.31em")
                .attr("x", d => d.x < Math.PI === !d.children ? 6 : -6)
                .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
                .style("text-anchor", d => d.x < Math.PI ? "start" : "end")
                .text(d => d.data.name)
                .on("mouseover", function(event, d) {
                    if (d.data.name) {
                        tooltip.transition()
                            .duration(200)
                            .style("opacity", .9);
                        tooltip.html(d.data.name)
                            .style("left", (event.pageX + 5) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    }
                })
                .on("mouseout", function(event, d) {
                    if (d.data.name) {
                        tooltip.transition()
                            .duration(500)
                            .style("opacity", 0);
                    }
                });

            const tooltip = d3.select("body").append("div")
                .attr("class", "tooltip")
                .style("opacity", 0);

            function radialPoint(x, y) {
                return [y * Math.cos(x - Math.PI / 2), y * Math.sin(x - Math.PI / 2)];
            }
        }
    </script>
{% endblock %}
