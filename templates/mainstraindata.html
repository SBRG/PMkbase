<!--
    mainstraindata.html

    Description:
        Renders the main strain data page for PMkbase.
        Displays tables of growth activity and kinetic parameters for a selected strain and plate.
        Provides interactive dropdowns for parameter and compound selection, and visualizes data using Highcharts.

    Sections:
        - Head: Custom CSS for tables, charts, dropdowns, and layout.
        - Body: Growth activity table, parameter and compound dropdowns, and chart containers.
        - Script: DataTables and Highcharts configuration, AJAX updates for charts.
        - Jinja Blocks: 'head', 'body', and 'script' for child templates.
-->

{% extends 'strainbase.html' %}

{% block head %}
    <!--
        Head Block:
        - Custom CSS for layout, tables, charts, and dropdowns.
    -->
    <style>
        .dtableforstrain { margin-left:250px; }
        .dtprojectforstrain { margin-left:1000px; margin-right: 100px; height:50px; margin-top: 200px; width: 100px; }
        .dtprojectforgrowth { margin-left:1000px; height:50px; margin-top: 200px; width: 100px; }
        #project_id.dataTable tbody tr:hover,
        #table_id.dataTable tbody tr:hover { background-color: lightgrey; }
        #container_linechart { height: 300px; margin-left: 25%; margin-top: 50px; width: 1000px; }
        .dropdown-menu-scrollable { max-height: 150px; overflow-y: auto; }
        #table_container { width: 80%; margin-left: 15%; overflow-x: auto; }
        #container { margin-left: 15%; width: 80%; margin-top: 20px; margin-bottom: 20px; }
        .highcharts-figure, .highcharts-data-table table { min-width: 360px; max-width: 800px; margin: 1em auto; }
        .highcharts-data-table table { font-family: Verdana, sans-serif; border-collapse: collapse; border: 1px solid #ebebeb; margin: 10px auto; text-align: center; width: 100%; max-width: 500px; }
        .highcharts-data-table caption { padding: 1em 0; font-size: 1.2em; color: #555; }
        .highcharts-data-table th { font-weight: 600; padding: 0.5em; }
        .highcharts-data-table td, .highcharts-data-table th, .highcharts-data-table caption { padding: 0.5em; }
        .highcharts-data-table thead tr, .highcharts-data-table tr:nth-child(even) { background: #f8f8f8; }
        .highcharts-data-table tr:hover { background: #f1f7ff; }
        .highcharts-credits { display: none !important; }
        .highcharts-contextbutton, .highcharts-exporting-group, .highcharts-button-symbol.highcharts-print-button { display: none; }
        .light-pink { background-color: #FFD1DC; }
        .light-blue { background-color: #C0C0FF; }
    </style>
{% endblock %}

{% block body %}
    <!--
        Body Block:
        - Growth activity table for the selected strain and plate.
        - Parameter and compound dropdowns for chart selection.
        - Chart containers for kinetic parameters and measured signals.
    -->
    <br>
    <div id="table_container">
        <table id="table_id_growth" class="table table-hover">
            <thead style="background-color: rgb(255, 255, 255)">
                <tr>
                    <th>Well</th>
                    <th>Compound</th>
                    <th>Activity</th>
                    <th>Description</th>
                    <th>KEGG ID</th>
                    <th>CAS ID</th>
                </tr>
            </thead>
        </table>
    </div>
    <br><br><br>
    <div class="dropdown" style="margin-left: 15%;">
        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="background-color: #fffcfc;color: black;">
            Max Resp
        </button>
        <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
            <a class="dropdown-param-item dropdown-item" data-param="Max Resp">Max Resp</a>
            <a class="dropdown-param-item dropdown-item" data-param="Max Resp Rate">Max Resp Rate</a>
            <a class="dropdown-param-item dropdown-item" data-param="Time till max resp rate">Time till max resp</a>
            <a class="dropdown-param-item dropdown-item" data-param="AUC">AUC</a>
        </div>
    </div>
    <div id="container"></div>
    <div class="dropdown2" style="margin-left: 15%;">
        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownCompoundsButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="background-color: #fffcfc;color: black;">
            Select Compound
        </button>
        <div class="dropdown-menu dropdown-menu-scrollable" aria-labelledby="dropdownCompoundsButton">
            {% for compound in dropdown_compounds %}
                <a class="dropdown-compound-item dropdown-item" data-compound="{{ compound }}">{{ compound }}</a>
            {% endfor %}
        </div>
    </div>
    <div id="container_linechart"></div>
    <script src="https://code.highcharts.com/stock/highstock.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script>
        var categories = {{ categories|safe }};
        var mean_data = {{ mean_data|safe }};
        var error_data = {{ error_data|safe }};
        var param_name = "{{param_name|safe}}";
        var growth_data = {{ growth_data|safe }};
        var time_series = {{ time_series|safe }};
    </script>
{% endblock %}

{% block script %}
    <!--
        Script Block:
        - Configures DataTables for growth activity.
        - Handles AJAX updates for kinetic parameter and growth curve charts.
        - Sets up event listeners for dropdowns.
        - Renders Highcharts column/errorbar and line charts.
    -->
    <script>
        $(document).ready(function() {
            var table_growth = $('#table_id_growth').DataTable({
                "paging": false,
                "ajax": '/strain_growth/json?plate={{ pltid }}&spec={{ strn }}',
                "scrollCollapse": true,
                "scrollY": '250px',
                "info": false,
                "createdRow": function(row, data, dataIndex) {
                    // Highlight rows based on activity
                    if (data[2] == "Yes") {
                        row.style.backgroundColor = "#FFD1DC";
                    } else if (data[2] == "Uncertain") {
                        row.style.backgroundColor = "#C0C0FF";
                    }
                }
            });
        });

        /**
         * Updates the kinetic parameter chart based on selected parameter.
         * Fetches new data via AJAX and redraws the chart.
         * @param {string} param - Selected parameter name.
         */
        function updateChart(param) {
            $.ajax({
                url: '/update_chart',
                type: 'GET',
                data: {
                    pltid: '{{ pltid }}',
                    strn: '{{ strn }}',
                    param: param
                },
                success: function(response) {
                    categories = response.categories;
                    mean_data = response.mean_data;
                    error_data = response.error_data;
                    param_name = param;
                    Highcharts.charts[0].update({
                        xAxis: { categories: categories },
                        yAxis: { title: { text: param_name } },
                        series: [{ data: mean_data }, { data: error_data }]
                    });
                }
            });
        }

        // Event listener for the parameter dropdown items
        $('.dropdown-param-item').click(function() {
            var param = $(this).data('param');
            $('#dropdownMenuButton').text(param);
            updateChart(param);
        });

        Highcharts.chart('container', {
            chart: { zoomType: 'x' },
            title: { text: 'Kinetic Parameters' },
            xAxis: { categories: categories, pointRange: 20 },
            scrollbar: { enabled: true, margin: 50, showFull: false },
            yAxis: [{ title: { text: param_name } }],
            tooltip: { shared: true },
            plotOptions: {
                series: {
                    marker: { enabled: false, states: { hover: { enabled: false } } }
                }
            },
            series: [
                { name: '', type: 'column', color:'rgba(0,0,0,0)', data: mean_data, tooltip: { pointFormat: '<span style="font-weight: bold; color: {series.color}">{series.name}</span>:' } },
                { name: '', type: 'errorbar', yAxis: 0, data: error_data, tooltip: { pointFormat: '(replicate range: {point.low}-{point.high})<br/>' } }
            ]
        });

        /**
         * Updates the growth curve chart based on selected compound.
         * Fetches new data via AJAX and adds series to the chart.
         * @param {string} compound - Selected compound name.
         */
        function updategrowthchart(compound) {
            $.ajax({
                url: '/update_growth_curve',
                type: 'GET',
                data: {
                    pltid: '{{ pltid }}',
                    strn: '{{ strn }}',
                    compound: compound
                },
                success: function(response) {
                    new_growth_data = response.growth_data;
                    var chart = Highcharts.charts[1];
                    new_growth_data.forEach(function(series) {
                        chart.addSeries(series, false);
                    });
                    chart.redraw();
                }
            });
        }

        // Event listener for the compound dropdown items
        $('.dropdown-compound-item').click(function() {
            var compound = $(this).data('compound');
            $('#dropdownCompoundsButton').text(compound);
            updategrowthchart(compound);
        });

        Highcharts.chart('container_linechart', {
            title: { text: 'Measured signal(s)', align:'center' },
            yAxis: { title: { text: 'Signal' } },
            xAxis: { categories: time_series, title: { text:'Time (hrs)' } },
            chart: { marginBottom: 150 },
            legend: { layout: 'horizontal', align: 'center', verticalAlign: 'bottom' },
            plotOptions: { series: { label: { connectorAllowed: false } } },
            series: growth_data,
            responsive: {
                rules: [{
                    condition: { maxWidth: 500 },
                    chartOptions: {
                        legend: { layout: 'horizontal', align: 'center', verticalAlign: 'bottom' }
                    }
                }]
            }
        });
    </script>
{% endblock %}
