<!--
    comparative_analysis.html

    Description:
        Renders the comparative analysis page for PMkbase.
        Displays heatmap and growth curve charts using Highcharts.
        Used for visualizing growth calls and signal data across strains and compounds.

    Sections:
        - Head: Loads Highcharts scripts and custom CSS for chart/table styling.
        - Body: Color legend, chart containers, and data injection.
        - Script: Highcharts configuration for heatmap and growth curve charts.
        - Jinja Blocks: 'head', 'body', and 'script' for child templates.
-->

{% extends 'base.html' %}

{% block head %}
    <!--
        Head Block:
        - Loads Highcharts libraries for heatmap and chart rendering.
        - Defines custom CSS for styling charts and tables.
        - Hides export/print buttons in Highcharts.
    -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/heatmap.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script src="https://code.highcharts.com/modules/series-label.js"></script>

    <style>
        .highcharts-figure,
        .highcharts-data-table table {
            min-width: 360px;
            max-width: 800px;
            margin: 1em auto;
        }

        .highcharts-data-table table {
            font-family: Verdana, sans-serif;
            border-collapse: collapse;
            border: 1px solid #ebebeb;
            margin: 10px auto;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .highcharts-data-table caption {
            padding: 1em 0;
            font-size: 1.2em;
            color: #555;
        }

        .highcharts-data-table th {
            font-weight: 600;
            padding: 0.5em;
        }

        .highcharts-data-table td,
        .highcharts-data-table th,
        .highcharts-data-table caption {
            padding: 0.5em;
        }

        .highcharts-data-table thead tr,
        .highcharts-data-table tr:nth-child(even) {
            background: #f8f8f8;
        }

        .highcharts-data-table tr:hover {
            background: #f1f7ff;
        }

        .highcharts-credits {
            display: none !important;
        }

        /* Hide the contextButton (export menu button) */
        .highcharts-contextbutton {
            display: none;
        }

        /* Hide the exportButton (export to PNG/SVG/CSV/XLS button) */
        .highcharts-exporting-group {
            display: none;
        }

        /* Hide the printButton (print chart button) */
        .highcharts-button-symbol.highcharts-print-button {
            display: none;
        }
    </style>
{% endblock %}

{% block body %}
    <!--
        Body Block:
        - Displays color legend for growth calls.
        - Contains chart containers for heatmap and growth curve charts.
        - Injects chart data from Flask context.
    -->

    <!-- Color legend for growth calls -->
    <div style="width:50px; margin-left: 690px; margin-top:30px; height:50px; float: left; background: #f2b6ee; border:2px solid #000;"></div>
    <div style="width:50px; margin-left: 100px; margin-top:30px; height:50px; float: left; background: #FFFFFF; border:2px solid #000;"></div>
    <div style="width:50px; margin-left: 100px; margin-top:30px; height:50px; float: left; background: #b6daf2; border:2px solid #000;"></div>
    <div style="width:50px; margin-left: 100px; margin-top:30px; height:50px; float: left; background: #c4f2b6; border:2px solid #000;"></div>
    <div style="margin-top:120px; margin-left: 690px; height:10px; position: sticky;">Growth</div>
    <div style="margin-left:830px; height:10px; position: sticky; margin-top: -10px;">No Growth</div>
    <div style="margin-left: 980px; height:10px; margin-top: -10px">Uncertain</div>
    <div style="margin-left: 1150px; height:10px; margin-top: -10px">N.A</div>

    <!-- Chart containers -->
    <div id="chartContainer" class="chart" style="height: 200px; width: 1200px; margin-top: 60px; margin-left: 300px;"></div>
    <div id="chartContainer2" class="chart" style="height: 500px; width: 1200px; margin-top: 60px; margin-left: 330px;"></div>

    <!-- Inject chart data from Flask context -->
    <script>
        var growth_calls = {{ growth_calls|safe }};
        var xlabels = {{ xlabels|safe }};
        var ylabels = {{ ylabels|safe }};
        var series = {{ series|safe }};
        var time = {{ time|safe }};
    </script>
{% endblock %}

{% block script %}
    <!--
        Script Block:
        - Configures Highcharts heatmap and growth curve charts.
        - Uses injected data for rendering.
    -->

    <script>
        /**
         * Returns the category name for a given point and axis dimension.
         * @param {Object} point - Highcharts point object.
         * @param {string} dimension - 'x' or 'y'.
         * @returns {string} Category name.
         */
        function getPointCategoryName(point, dimension) {
            var series = point.series,
                isY = dimension === 'y',
                axis = series[isY ? 'yAxis' : 'xAxis'];
            return axis.categories[point[isY ? 'y' : 'x']];
        }

        Highcharts.chart('chartContainer', {
            chart: {
                type: 'heatmap',
                marginTop: 40,
                marginBottom: 80,
                plotBorderWidth: 1
            },
            title: {
                text: '',
                style: {
                    fontSize: '1em'
                }
            },
            xAxis: {
                categories: xlabels
            },
            yAxis: {
                categories: ylabels,
                title: null,
                reversed: true
            },
            accessibility: {
                point: {
                    descriptionFormatter: function (point) {
                        var ix = point.index + 1,
                            xName = getPointCategoryName(point, 'x'),
                            yName = getPointCategoryName(point, 'y'),
                            val = point.value;
                        return ix + '. ' + xName + ' sales ' + yName + ', ' + val + '.';
                    }
                }
            },
            colorAxis: {
                dataClasses: [
                    { from: 0, to: 0.5, color: '#FFFFFF' },   // No Growth
                    { from: 0.5, to: 0.75, color: '#b6daf2' }, // Uncertain
                    { from: 0.75, to: 1, color: '#c4f2b6' },   // N.A
                    { from: 1, color: '#f2b6ee' }              // Growth
                ],
                showInLegend: false
            },
            legend: {
                align: 'center',
                layout: 'vertical',
                margin: 0,
                verticalAlign: 'top',
                y: 25,
                symbolHeight: 280
            },
            tooltip: {
                formatter: function () {
                    if (this.point.value == 1) {
                        return getPointCategoryName(this.point, 'x') + ', Growth: Yes';
                    } else if (this.point.value == 0) {
                        return getPointCategoryName(this.point, 'x') + ', Growth: No';
                    } else if (this.point.value == 0.5) {
                        return getPointCategoryName(this.point, 'x') + ', Growth: Uncertain';
                    } else if (this.point.value == 0.75) {
                        return getPointCategoryName(this.point, 'x') + ', Growth: Data N.A';
                    }
                }
            },
            series: [{
                name: 'Growth(1)/No Growth(0)/Uncertain(0.5)',
                borderWidth: 2.5,
                data: growth_calls,
                borderColor: '#0a000f',
                dataLabels: {
                    enabled: false,
                    color: '#000000'
                },
                showInLegend: false
            }],
            responsive: {
                rules: [{
                    condition: {
                        maxWidth: 500
                    },
                    chartOptions: {
                        yAxis: {
                            labels: {
                                formatter: function () {
                                    return this.value.charAt(0);
                                }
                            }
                        }
                    }
                }]
            }
        });
    </script>

    <script>
        Highcharts.chart('chartContainer2', {
            title: {
                text: 'Growth on ' + '{{ylabels[0]}}',
                align: 'center'
            },
            yAxis: {
                title: {
                    text: 'Fluoroscence signal'
                },
                min: 0,
                max: 500
            },
            xAxis: {
                categories: time,
                title: { text: 'Time (hrs)' }
            },
            series: series,
            responsive: {
                rules: [{
                    condition: {
                        maxWidth: 500
                    },
                    chartOptions: {
                        legend: {
                            layout: 'horizontal',
                            align: 'center',
                            verticalAlign: 'bottom'
                        }
                    }
                }]
            }
        });
    </script>
{% endblock %}
