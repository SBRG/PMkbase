<!--
    base.html

    Description:
        Base template for PMkbase web application.
        Provides global CSS, JS, navigation bar, and layout structure.
        Other templates extend this file and fill in the 'head', 'body', and 'script' blocks.

    Sections:
        - Head: Loads global JS/CSS libraries (jQuery, Bootstrap, DataTables, Highcharts, D3).
        - Style: Shared responsive rules from '_responsive.html'.
        - Body: Navigation bar and content block.
        - Script: Utility JS for navigation highlighting.
        - Jinja Blocks: 'head', 'body', and 'script' for child templates.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        Global JS/CSS libraries:
        - jQuery
        - DataTables
        - Popper.js
        - Bootstrap
        - Highcharts
        - D3.js
    -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://d3js.org/d3.v6.min.js"></script>

    {% block head %}{% endblock %}

    {% include '_responsive.html' %}
</head>

<body>
    <!--
        Navigation Bar:
        - Dashboard, About, Plates links.
        - Uses Bootstrap for styling; collapses behind a toggler on small screens.
        - 'dodajAktywne' JS function highlights active link.
    -->
    <nav class="navbar navbar-expand-sm navbar-light" style="background-color: white;">
        <button class="navbar-toggler ml-auto" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <a class="nav-link" id="a-dashboard" href="{{ url_for('index') }}" onclick="dodajAktywne(this)">Dashboard<span class="sr-only">(current)</span></a>
            <a class="nav-link" href="{{ url_for('about') }}">About <span class="sr-only">(current)</span></a>
            <a class="nav-link" href="{{ url_for('plates') }}">Plates <span class="sr-only">(current)</span></a>
            <!--
                Additional navigation links can be added here.
                Example:
                <a class="nav-link" href="{{ url_for('explore') }}">Explore <span class="sr-only">(current)</span></a>
            -->
            <ul class="navbar-nav" style="margin-left: auto; font-family: monospace;">
                <li class="nav-item active">
                    <!-- Placeholder for future nav items -->
                </li>
                <li class="nav-item">
                    <!-- Placeholder for future nav items -->
                </li>
            </ul>
        </div>
    </nav>

    {% block body %}{% endblock %}
</body>

<script>
    /**
     * Highlights the active navigation link.
     * Removes 'active' class from all links and adds it to the clicked link.
     * @param {HTMLElement} elem - The clicked navigation link.
     */
    function dodajAktywne(elem) {
        var a = document.getElementsByTagName('a');
        for (var i = 0; i < a.length; i++) {
            a[i].classList.remove('active');
        }
        elem.classList.add('active');
    }
</script>

{% block script %}{% endblock %}
</html>
